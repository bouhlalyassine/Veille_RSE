name: Deploiement Azure App Service

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: azure-webapp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Les dependances sont installees par App Service (SCM_DO_BUILD_DURING_DEPLOYMENT).
      - name: Deployer sur App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
